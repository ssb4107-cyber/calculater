<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fa;
    height:100vh;
}

.layout{
    display:grid;
    grid-template-columns:280px 1fr;
    height:100vh;
}

.sidebar{
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    border-bottom:1px solid #eee;
}

.header h2{
    margin-bottom:15px;
}

#addStockBtn{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.stock-list{
    flex:1;
    overflow:auto;
}

.stock-item{
    padding:15px 20px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:.2s;
}

.stock-item:hover{
    background:#f3f4f6;
}

.stock-item.active{
    background:#dbeafe;
    font-weight:bold;
}

.content{
    padding:40px;
}

#stockTitle{
    font-size:30px;
    margin-bottom:10px;
}

#stockInfo{
    color:#666;
    margin-bottom:30px;
}

#stockForm{
    display:none;
    max-width:500px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:25px;
}

#stockForm h3{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

textarea{
    resize:vertical;
}

#saveStockBtn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}
#addPositionBtn{

    padding:10px 18px;

    background:#16a34a;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

.position-card{

    background:white;

    border:1px solid #ddd;

    border-radius:10px;

    padding:15px;

    margin-bottom:15px;

}

.position-title{

    font-size:18px;

    font-weight:bold;

    margin-bottom:8px;

}
</style>

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="header">

            <h2>📈 Portfolio</h2>

            <button id="addStockBtn">
                + 새 종목
            </button>

        </div>

        <div class="stock-list" id="stockList">

            <div class="stock-item active">
                PAAS
            </div>

            <div class="stock-item">
                AG
            </div>

        </div>

    </aside>

    <main class="content">

        <h1 id="stockTitle">PAAS</h1>

        <div id="stockInfo">
            종목을 선택했습니다.
        </div>

        <hr style="margin:25px 0;">

<div id="positionSection">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">

        <h2>🟢 OPEN Position</h2>

        <button id="addPositionBtn">
            + Position
        </button>

    </div>

    <div id="positionList">

    아직 Position이 없습니다.

</div>

<div id="positionForm" style="display:none; margin-top:25px;">

    <h3>새 Position</h3>

    <br>

    <label>매수가</label><br>
    <input id="buyPrice" type="number">

    <br><br>

    <label>수량</label><br>
    <input id="buyQty" type="number">

    <br><br>

    <label>날짜</label><br>
    <input id="buyDate" type="date">

    <br><br>

    <label>메모</label><br>
    <textarea id="buyMemo"></textarea>

    <br><br>

    <button id="savePositionBtn">

        저장

    </button>

</div>

</div>

        <div id="stockForm">

            <h3>새 종목 추가</h3>

            <div class="form-group">
                <label>종목명</label>
                <input id="stockName" type="text">
            </div>

            <div class="form-group">
                <label>심볼</label>
                <input id="stockSymbol" type="text">
            </div>

            <div class="form-group">
                <label>메모</label>
                <textarea id="stockMemo" rows="4"></textarea>
            </div>

            <button id="saveStockBtn">
                저장
            </button>

        </div>

    </main>

</div>

<script src="../js/portfolio.js"></script>
</body>
</html>
